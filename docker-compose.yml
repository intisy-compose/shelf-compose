# shelf.nu asset management with a self-hosted Supabase (Postgres, Auth, Storage), reachable over
# Tailscale and on this PC's 127.0.0.1:8444. Every image is pinned; start it through docker-compose.ps1, which passes
# --env-file config.env and fills in the tailnet URLs once the node has joined.
name: shelf-compose

x-volume-roles:
  shelf-db: dumped
  shelf-db-config: rebuilt
  gateway-caddy-data: rebuilt
  tailscale-socket: rebuilt

services:
  # shelf shares this namespace. It answers 502 until auth, storage and shelf are up, and starts
  # without them so `up` can join the tailnet before they need the ts.net name.
  gateway:
    extends: { file: gateway/gateway.yml, service: gateway }
    container_name: shelf-gateway
    ports:
      - "127.0.0.1:8444:8444"
      - "127.0.0.1:8445:8445"
      - "127.0.0.1:8025:8025"
    environment:
      TAILNET_HOST: ${SHELF_HOST:-shelf.invalid}
    volumes:
      - ./gateway/templates:/srv/templates:ro
    # shelf's server calls SUPABASE_URL too; inside this namespace the ts.net name has to reach Caddy
    # directly, since userspace networking cannot dial the node's own tailnet address.
    extra_hosts:
      - "${SHELF_HOST:-shelf.invalid}:127.0.0.1"

  tailscale:
    extends: { file: gateway/gateway.yml, service: tailscale }
    container_name: shelf-tailscale
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-shelf}

  shelf:
    build:
      context: ./shelf-image
    image: shelf-osm:2.2.0
    container_name: shelf-server
    restart: unless-stopped
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      DIRECT_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_PUBLIC: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE: ${SERVICE_ROLE_KEY}
      SERVER_URL: ${SERVER_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      INVITE_TOKEN_SECRET: ${INVITE_TOKEN_SECRET}
      FINGERPRINT: ${FINGERPRINT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PWD: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      MAPTILER_TOKEN: ${MAPTILER_TOKEN}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT}
      ENABLE_PREMIUM_FEATURES: "false"
      DISABLE_SIGNUP: ${DISABLE_SIGNUP}

  db:
    image: supabase/postgres:17.6.1.136
    container_name: shelf-db
    restart: unless-stopped
    volumes:
      - ./db/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db/99-jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      # Named volumes: Postgres on a Windows bind mount fails on file permissions.
      - shelf-db:/var/lib/postgresql/data
      # The pgsodium root key lives in data/secrets; losing it makes encrypted columns unreadable.
      # The entrypoint copies it into shelf-db-config because a Windows bind mount is root-only (0640).
      - ./data/secrets/pgsodium_root.key:/run/secrets/pgsodium_root.key:ro
      - shelf-db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    entrypoint:
      - sh
      - -c
      - cp /run/secrets/pgsodium_root.key /etc/postgresql-custom/pgsodium_root.key && chown postgres:postgres /etc/postgresql-custom/pgsodium_root.key && chmod 0640 /etc/postgresql-custom/pgsodium_root.key && exec docker-entrypoint.sh "$$@"
      - --
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  auth:
    image: supabase/gotrue:v2.196.0
    container_name: shelf-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SERVER_URL}
      GOTRUE_URI_ALLOW_LIST: ${SERVER_URL}/reset-password
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SUPABASE_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      # shelf only accepts 6-digit codes; GoTrue's default is 8.
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_MAILER_OTP_EXP: 3600
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway:8000/templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://gateway:8000/templates/magic_link.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://gateway:8000/templates/recovery.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Your shelf confirmation code
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your shelf login code
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Your shelf password reset code
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}

  storage:
    image: supabase/storage-api:v1.74.0
    container_name: shelf-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: shelf
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: shelf
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - ./data/storage:/var/lib/storage

  mail:
    image: axllent/mailpit:v1.31.2
    container_name: shelf-mail
    restart: unless-stopped

  migrate:
    build:
      context: ./migrate
      additional_contexts:
        shelf-database: https://github.com/Shelf-nu/shelf.nu.git#shelf@2.2.0:packages/database
    image: shelf-migrate:2.2.0
    container_name: shelf-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      DIRECT_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres

  # Creates the four buckets shelf expects; a bucket that already exists answers 409 and is skipped.
  init:
    image: curlimages/curl:8.16.0
    container_name: shelf-init
    depends_on:
      storage:
        condition: service_healthy
    environment:
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    entrypoint: ["sh", "-c"]
    command:
      - |
        for spec in profile-pictures:true assets:false kits:false files:true; do
          name=$${spec%%:*}; public=$${spec#*:}
          code=$$(curl -s -o /tmp/out -w '%{http_code}' -X POST http://storage:5000/bucket \
            -H "Authorization: Bearer $$SERVICE_ROLE_KEY" -H 'Content-Type: application/json' \
            -d "{\"id\":\"$$name\",\"name\":\"$$name\",\"public\":$$public}")
          case "$$code" in
            200) echo "created bucket $$name" ;;
            400|409) grep -q -i 'exists' /tmp/out && echo "bucket $$name exists" || { cat /tmp/out; exit 1; } ;;
            *) echo "bucket $$name failed ($$code)"; cat /tmp/out; exit 1 ;;
          esac
        done

  db-backup:
    image: supabase/postgres:17.6.1.136
    container_name: shelf-db-backup
    restart: unless-stopped
    # The postgres image's own healthcheck probes a server this container never runs.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        log() { echo "$$(date '+%Y-%m-%d %H:%M:%S') $$1" >> /backups/backup.log; }
        while true; do
          # One interval first, so no pass dumps a database that `up` is still restoring or migrate is changing.
          sleep 3600
          # A dump killed mid-write (container stop) leaves its .tmp behind, and nothing else removes it.
          rm -f /backups/shelf-*.dump.tmp
          ts=$$(date +%Y%m%d-%H%M%S)
          tables=$$(psql -h db -U supabase_admin -d postgres -Atc "select count(*) from information_schema.tables where table_schema = 'public'" 2>/dev/null)
          if [ "$$tables" = "0" ]; then
            log "skipped: database has no tables"
          elif pg_dump -h db -U supabase_admin -d postgres -Fc -f /backups/shelf-$$ts.dump.tmp 2> /backups/last-error.log; then
            mv /backups/shelf-$$ts.dump.tmp /backups/shelf-$$ts.dump
            log "created shelf-$$ts.dump"
          else
            rm -f /backups/shelf-$$ts.dump.tmp
            log "FAILED shelf-$$ts.dump"
          fi
          ls -1t /backups/shelf-*.dump 2>/dev/null | tail -n +$$(( ${BACKUP_KEEP:-48} + 1 )) | while read -r old; do rm -f "$$old"; log "deleted $$(basename "$$old")"; done
        done

volumes:
  shelf-db:
  shelf-db-config:
  gateway-caddy-data:
  tailscale-socket:
