# The one Supabase URL shelf talks to: Auth and Storage under their usual paths, plus the OTP email
# templates GoTrue fetches over HTTP.
server {
    listen 8000;
    client_max_body_size 50m;

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/v1/ {
        proxy_pass http://storage:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /storage/v1;
    }

    location /templates/ {
        alias /usr/share/nginx/templates/;
    }
}
